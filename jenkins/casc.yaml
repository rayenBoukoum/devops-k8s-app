jenkins:
  systemMessage: "CD of devops-k8s-app to Kubernetes (images built by GitHub Actions)"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}   # from jenkins/.env, never committed
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - file:                                # kubeconfig of the kind cluster, stored as a Jenkins secret
              scope: GLOBAL
              id: kubeconfig
              fileName: kubeconfig
              secretBytes: ${readFileBase64:/run/secrets/kubeconfig}

jobs:
  - script: |
      pipelineJob('devops-k8s-app') {
        description('Deploys the images published by GitHub Actions to the kind cluster')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/rayenBoukoum/devops-k8s-app.git') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: docker.io/${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4          # download the repo code on the runner

      - name: Build images (compiles Java + Angular inside Docker)
        run: |
          TAG=sha-${GITHUB_SHA::7}
          for svc in backend frontend; do
            docker build -t $IMAGE_PREFIX/devops-$svc:$TAG -t $IMAGE_PREFIX/devops-$svc:latest ./$svc
          done

      - name: Log in to Docker Hub
        if: github.event_name == 'push'    # pull requests only build, never publish
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        if: github.event_name == 'push'
        run: |
          for svc in backend frontend; do
            docker push --all-tags $IMAGE_PREFIX/devops-$svc
          done

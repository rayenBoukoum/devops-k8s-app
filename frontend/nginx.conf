events {}
http {
  include /etc/nginx/mime.types;   # without it, JS files are refused by the browser
  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }   # Angular routes -> index.html
    location /api/ {
      proxy_pass http://backend:8081/;                  # /api/user/all -> backend:8081/user/all
    }
  }
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fullstack
spec:
  # no "replicas": the HPA (50-backend-hpa.yaml) owns the replica count (2 to 5)
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: rayenbkm/devops-backend:sha-7e84027   # pinned CI tag (never :latest, see report)
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/demo   # "mysql" = Service name
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_PASSWORD
          resources:
            requests:           # reserved: used by the scheduler and by the HPA (% CPU)
              cpu: 100m         # 100 millicores = 0.1 CPU
              memory: 256Mi
            limits:             # maximum: CPU throttled above, container killed above memory
              cpu: "1"          # Spring Boot startup is CPU-heavy
              memory: 512Mi
          startupProbe:         # slow start: allow up to 30 x 5s = 150s before liveness takes over
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:       # receive traffic only when the app AND the database answer
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
          livenessProbe:        # restart the container if the JVM is stuck
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend             # DNS name used by Nginx: proxy_pass http://backend:8081
  namespace: fullstack
spec:
  selector:
    app: backend
  ports:
    - port: 8081

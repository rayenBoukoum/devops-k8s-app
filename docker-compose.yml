services:
  frontend:
    build: ./frontend
    image: devops-frontend
    ports: ["4200:80"]            # only entry point from the host
    depends_on: [backend]

  backend:
    build: ./backend
    image: devops-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/demo   # "mysql" = service name (DNS)
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy   # wait until MySQL accepts connections

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql"]   # data survives container deletion
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
